<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta
            name="description"
            content="Prompt Compiler - Transform raw inputs into optimized LLM prompts using deterministic templates and intent classification."
        >
        <title>Prompt Compiler</title>

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
            rel="stylesheet"
        >

        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="app-container">
            <!-- Header -->
            <header class="header">
                <h1>⚡ Prompt Compiler</h1>
                <p class="tagline">
                    Transform underspecified inputs into optimized LLM prompts.
                    Zero API calls. Pure local transformation.
                </p>
            </header>

            <!-- Main Content -->
            <main class="main-grid">
                <!-- Input Panel -->
                <section class="panel input-panel">
                    <div class="panel-header">
                        <span class="panel-title">Raw Input</span>
                        <div class="metadata-bar" id="inputMeta">
                            <span class="metadata-item" id="charCount"
                            >0 characters</span>
                        </div>
                    </div>
                    <div class="input-area">
                        <textarea
                            id="inputArea"
                            class="input-textarea"
                            placeholder="Type your prompt here...

Examples:
• 'How do I write a binary search in Python?'
• 'Explain quantum computing to a 5 year old'
• 'Write a short story about a robot learning to love'
• 'Analyze the pros and cons of remote work'"
                        ></textarea>
                    </div>
                </section>

                <!-- Output Panel -->
                <section class="panel output-panel">
                    <div class="panel-header">
                        <span class="panel-title">Optimized Prompt</span>
                        <div class="metadata-bar" id="outputMeta">
                            <span class="intent-badge general" id="intentBadge"
                            >General</span>
                            <div class="metadata-item">
                                <span>Confidence:</span>
                                <div class="confidence-bar">
                                    <div
                                        class="confidence-fill"
                                        id="confidenceFill"
                                        style="width: 0%"
                                    >
                                    </div>
                                </div>
                                <span id="confidenceValue">0%</span>
                            </div>
                            <button class="copy-btn" id="copyBtn" disabled>
                                <svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    width="16"
                                    height="16"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >
                                    <rect
                                        x="9"
                                        y="9"
                                        width="13"
                                        height="13"
                                        rx="2"
                                        ry="2"
                                    >
                                    </rect>
                                    <path
                                        d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"
                                    >
                                    </path>
                                </svg>
                                Copy
                            </button>
                        </div>
                    </div>
                    <div class="output-area">
                        <div class="output-content empty" id="outputContent">
                            Start typing to see the optimized prompt...
                        </div>
                    </div>
                    <div
                        class="stats-footer"
                        id="statsFooter"
                        style="display: none"
                    >
                        <div class="stat">
                            <span class="stat-label">Template</span>
                            <span class="stat-value" id="templateName">—</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Match Type</span>
                            <span class="stat-value" id="matchType">—</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Processing Time</span>
                            <span class="stat-value fast" id="processingTime"
                            >—</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Output Length</span>
                            <span class="stat-value" id="outputLength">—</span>
                        </div>
                    </div>
                </section>
            </main>
        </div>

        <script type="module" src="index.js"></script>
    </body>
</html>
